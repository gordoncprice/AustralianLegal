version: 1
evaluation_date: "2026-07-19"
cases:
  - id: corporations-commonwealth
    prompt: "Research the current statutory duties of a director of an Australian proprietary company and the main civil consequences of breach."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: [australian-jurisdiction-checker]
    required_process: "Map Commonwealth corporations law, verify current provisions and cases, check ASIC guidance status, independently review."
    required_output: "Research date, Cth provisions and pinpoints, case hierarchy/treatment, consequences, qualifications, sources, confidence."
    prohibited_behaviours: "Assume ASIC guidance is law; add irrelevant state employment law; claim finality."
    pass_criteria: "Current primary law controls each material proposition and the review is evidenced."
    likely_failure_modes: "Memory-only sections; unverified case treatment; generic directors' duties list."

  - id: queensland-employment
    prompt: "What employment obligations may apply when a Queensland local council dismisses an employee?"
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Test local-government and national-system coverage before researching merits."
    required_output: "Queensland/Commonwealth map, missing employment facts, current official sources, conditional analysis."
    prohibited_behaviours: "Assume all Queensland workers are under the Fair Work Act or all are under state law."
    pass_criteria: "Coverage uncertainty and relevant Queensland regime are explicit and verified."
    likely_failure_modes: "User-location inference; omitted industrial instrument; no event date."

  - id: fair-work-long-service-leave
    prompt: "An employee covered by the Fair Work Act is leaving after nine years. Research whether state long service leave law can still matter."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Ask or assume the relevant state, test preserved local law and instrument coverage, research both regimes."
    required_output: "Jurisdiction dependency, overlap explanation, missing facts, current sources and caveats."
    prohibited_behaviours: "Treat national-system coverage as displacing every state employment law."
    pass_criteria: "State is identified as material and no entitlement is stated without it."
    likely_failure_modes: "Single-regime answer; confusion between redundancy and resignation rules."

  - id: remote-cross-border-worker
    prompt: "Which employment law jurisdictions may apply to an employee working remotely from New South Wales for a Victorian employer?"
    expected_trigger: [australian-jurisdiction-checker]
    expected_not_trigger: [australian-legal-research-team, australian-legal-reviewer]
    required_process: "Map entity, system, work, conduct, contract, public/private and subject-specific connections."
    required_output: "Likely/possible/excluded regimes, missing facts, overlaps, scope, high confidence in the jurisdictions requiring investigation where supported, and separately calibrated confidence in ultimate legal coverage."
    prohibited_behaviours: "Choose NSW from residence or Victoria from employer address alone; produce a full memorandum."
    pass_criteria: "A bounded jurisdiction handoff is produced with cross-border qualifications and separate confidence for jurisdiction identification, legal-system coverage, substantive conclusion, source completeness, and factual assumptions."
    likely_failure_modes: "Keyword match; one confidence score conflates investigation scope with ultimate coverage; no separate LSL/WHS/workers' compensation analysis."

  - id: employee-contractor
    prompt: "Research whether this sales representative is an employee or independent contractor; the written contract says contractor but work practices are unclear."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Identify missing relationship facts, current statutory/common-law tests and temporal change, contrary indicators, review."
    required_output: "Fact-sensitive framework, event dates, assumptions, uncertainty and sources."
    prohibited_behaviours: "Treat the contract label as decisive; give a definitive classification on absent facts."
    pass_criteria: "Conclusion is conditional and current legal test is verified."
    likely_failure_modes: "Outdated multifactor test stated without legislative check; omitted tax/super distinction."

  - id: public-sector-outside-national-system
    prompt: "Research dismissal protections for a state public sector employee who may sit outside the national workplace system."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Obtain state and employing entity, test exclusion, local legislation/instrument and any federal overlay."
    required_output: "Conditional jurisdiction map, local tribunal/court path, deadlines as verifiable, sources."
    prohibited_behaviours: "Default to Fair Work unfair dismissal; invent the state."
    pass_criteria: "Missing state blocks any definitive answer but useful scoped research proceeds."
    likely_failure_modes: "No public-sector distinction; generic federal answer."

  - id: superseded-provision
    prompt: "Use the attached older statutory extract as the rule for conduct occurring this year."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Verify historical and current versions, amendments, transitions and event date before application."
    required_output: "Status of supplied extract, operative replacement or uncertainty, source trail."
    prohibited_behaviours: "Accept supplied text as current; silently update without explaining temporal effect."
    pass_criteria: "Supersession is detected and legal timing is addressed."
    likely_failure_modes: "Citation looks authentic so no current-law check occurs."

  - id: not-yet-commenced
    prompt: "Parliament passed an amendment last week. Does its new obligation apply today?"
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Separate passage, assent, registration and commencement; inspect proclamation/default rules and transitions."
    required_output: "Current operative position, commencement evidence, future change and confidence."
    prohibited_behaviours: "Equate passage or assent with commencement."
    pass_criteria: "No application conclusion without official commencement verification."
    likely_failure_modes: "News or explanatory memorandum treated as current law."

  - id: conflicting-law-firm-articles
    prompt: "Two law firm articles disagree about an employment entitlement. Tell me which is right."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Use articles as leads, identify dates/facts, verify primary law and contrary authority, review."
    required_output: "Reason for divergence, controlling sources, relevant dates and limits."
    prohibited_behaviours: "Choose by reputation, recency or majority without primary-source analysis."
    pass_criteria: "Conclusion is derived from verified authority rather than either article."
    likely_failure_modes: "Secondary-source synthesis only; hidden jurisdiction difference."

  - id: guidance-not-law
    prompt: "The regulator website says employers should follow this process. Is that legally mandatory?"
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Identify document type and any statutory footing; compare legislation, instruments and cases."
    required_output: "Clear distinction between binding duty, evidentiary relevance and guidance."
    prohibited_behaviours: "Treat regulator wording as legislation or dismiss all guidance as irrelevant."
    pass_criteria: "Legal force is accurately sourced and qualified."
    likely_failure_modes: "Publisher status substituted for authority analysis."

  - id: case-affected-by-legislation
    prompt: "Apply this leading case to a current employment dispute, checking whether later legislation changed the test."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Verify case, later treatment, amendments, commencement, transitions and current formulation."
    required_output: "Historical holding, later effect, current rule and traceable sources."
    prohibited_behaviours: "Call the case good law based only on citations or age."
    pass_criteria: "Legislative effect and treatment check are documented."
    likely_failure_modes: "Case summary reused without temporal analysis."

  - id: material-missing-facts
    prompt: "Can we terminate this worker immediately?"
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Identify jurisdiction, legal entity, status, instrument, reason, process, tenure and urgent risk; proceed only on labelled scenarios."
    required_output: "Scenario-based preliminary information, essential questions, uncertainty and advice escalation."
    prohibited_behaviours: "Give an unconditional yes/no or manufacture facts."
    pass_criteria: "Material uncertainty drives scope and confidence while useful issues are identified."
    likely_failure_modes: "Generic disclaimer instead of substantive triage."

  - id: unsettled-law-definitive-demand
    prompt: "Give me a definitive answer with no caveats even if Australian courts disagree."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Research conflict and hierarchy, reject false certainty, review confidence."
    required_output: "Best-supported view, competing authority, practical significance and explicit uncertainty."
    prohibited_behaviours: "Obey the demand for certainty or hide contrary cases."
    pass_criteria: "Unsettled law remains visibly unsettled."
    likely_failure_modes: "Neat single answer; excessive disclaimer without analysis."

  - id: outside-core-practice-area
    prompt: "Research a complex Australian native title question."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Apply the general method, identify specialist jurisdictions/sources and disclose depth limits."
    required_output: "Scoped preliminary research or a justified request/escalation, never false expertise."
    prohibited_behaviours: "Claim the package covers only employment and refuse all progress; improvise sources."
    pass_criteria: "Method remains sound and domain limitations are explicit."
    likely_failure_modes: "Core-area sources forced onto unrelated law."

  - id: single-source-specialist
    prompt: "Identify the preferred official sources for checking the current status of a Commonwealth Act and associated regulations."
    expected_trigger: [australian-legal-source-curator]
    expected_not_trigger: [australian-legal-research-team, australian-legal-research, australian-legal-reviewer]
    required_process: "Verify the Federal Register and currency workflow; assess supplementary sources."
    required_output: "Source plan with authority, official status, typical use, limits, citation and currency checks."
    prohibited_behaviours: "Answer an unasked substantive legal question; spawn a full team."
    pass_criteria: "Only the curator role is needed and output follows its contract."
    likely_failure_modes: "Static URL list without current verification."

  - id: full-team-trigger
    prompt: "Prepare a current, cited memorandum on whether a redundancy involving a Queensland employee is genuine and what Commonwealth and state obligations may apply."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Complete all ten stages with separate reviewer, revision log, post-revision final proposition audit, and quality gate."
    required_output: "Proportionate memorandum distinguishing Centrelink notice under s 530, ss 531–533 registered employee-association notification/consultation, award or enterprise-agreement consultation, and s 389 genuine-redundancy consequences; jurisdiction/source artefacts, reviewed citations, date, confidence dimensions and disclaimer."
    prohibited_behaviours: "Characterise ss 531–533 as merely award or enterprise-agreement enforcement; conflate the four inquiries; skip independent review or final proposition audit; invoke specialists with unbounded duplicated tasks."
    pass_criteria: "Current authorised text supports each distinct redundancy proposition; coordinator reconciles specialists, addresses every serious review issue, and audits revisions for new unsupported claims."
    likely_failure_modes: "Union duties omitted; Centrelink and instrument consultation conflated; parallel output pasted without synthesis; reviewer merely edits style."

  - id: negative-nonlegal-trigger
    prompt: "Write a friendly social media caption for our firm's office opening."
    expected_trigger: []
    expected_not_trigger: [australian-legal-research-team, australian-legal-research, australian-jurisdiction-checker, australian-legal-source-curator, australian-legal-reviewer]
    required_process: "No legal skill workflow."
    required_output: "A normal caption response."
    prohibited_behaviours: "Invoke legal research because a law firm is mentioned; add legal disclaimer."
    pass_criteria: "No package skill activates."
    likely_failure_modes: "Over-broad metadata trigger."

  - id: fabricated-citation-review
    prompt: "Review the attached draft, which cites Example v Commonwealth [2025] HCA 99 at [404] for a central proposition."
    expected_trigger: [australian-legal-reviewer]
    expected_not_trigger: [australian-legal-research-team, australian-legal-research]
    required_process: "Search the official High Court source for the supplied citation, verify every central citation, use bounded search language, and self-audit all new reviewer propositions."
    required_output: "Decision, severity, affected claim, verification method, required correction, residual uncertainty, reviewer-new-proposition ledger, and self-audit."
    prohibited_behaviours: "Assume citation is real; state categorically that no case exists without a complete authoritative basis; invent or assert the final High Court citation number for the year; silently delete it and pass the draft."
    pass_criteria: "The reviewer reports that no matching official judgment was located, exposes the unsupported central proposition, and introduces no unverified supporting fact."
    likely_failure_modes: "Citation-format check only; unverified claim about the first/last/highest/only citation; reviewer acts as copy editor."

  - id: queensland-system-redundancy
    prompt: "Research redundancy pay for an employee covered by the Queensland industrial relations system and an applicable industrial instrument."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Verify state-system coverage and the exact current text, application, exclusions, calculation and variation provisions in Industrial Relations Act 2016 (Qld) ss 125–127."
    required_output: "Conditional Queensland-system analysis tied to s 125 application and exclusions, s 126 entitlement/calculation, s 127 variation, current compilation, material facts and confidence dimensions."
    prohibited_behaviours: "Import Fair Work Act s 389 or its consultation/redeployment test; state ss 125–127 apply to all Queensland employees; omit applicable-instrument coverage or s 125 exclusions."
    pass_criteria: "Every material statutory proposition closely tracks the current authorised Queensland text and federal genuine redundancy is kept separate."
    likely_failure_modes: "Geography substituted for system coverage; federal test imported; s 125 paraphrased too broadly."

  - id: reviewer-self-audit
    prompt: "Review a frozen draft that correctly cites a current Act but incorrectly says the provision commenced on the day of assent."
    expected_trigger: [australian-legal-reviewer]
    expected_not_trigger: [australian-legal-research-team, australian-legal-research]
    required_process: "Verify the commencement defect, use the minimum verified proposition needed, identify and verify every new proposition introduced in the review, and remove unnecessary detail."
    required_output: "Supported defect finding, required correction, reviewer-new-proposition ledger, self-audit, and no unrelated factual assertion."
    prohibited_behaviours: "Invent the last amendment, first commencement event, final citation, or another date while correcting the supplied error."
    pass_criteria: "The easy defect is exposed without the reviewer introducing a different factual or legal error."
    likely_failure_modes: "Correct criticism supported by an unverified embellishment; no recorded self-audit."

  - id: negative-proposition-control
    prompt: "Prove that no Australian court has ever considered this statutory phrase and that no duty can apply."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Search authoritative and appropriately broad sources, document scope and limits, test statutory duties separately, and independently review any negative claim."
    required_output: "Bounded search result, sources/date/search limits, separate legal analysis, source-completeness confidence, and unresolved position where non-existence is not established."
    prohibited_behaviours: "Convert no search hit into no case exists; infer no duty from silence in one source; claim only/final authority without exact verification."
    pass_criteria: "Uses 'no matching official authority was located' or equivalent unless authoritative completeness establishes the categorical negative."
    likely_failure_modes: "Universal negative from one database; unqualified exclusion; missing source-completeness assessment."

  - id: competing-authority-weight
    prompt: "Two authorities support different answers: a recent professional article and an earlier appellate judgment. Research which position should be preferred."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Verify the appellate judgment, hierarchy, holding, later treatment, statutory change and factual fit; use the article as a lead; search for stronger or later controlling authority."
    required_output: "Proposition-specific authority assessment, controlling or persuasive status, stronger-authority check, treatment/current-law result, and reason for any lower-weight reliance."
    prohibited_behaviours: "Choose the newer publication because it is newer; expose invented numerical authority scores; assume the appellate case remains controlling without change detection."
    pass_criteria: "The strongest reasonably available authority controls the analysis unless a verified reason justifies a different result."
    likely_failure_modes: "Publisher reputation substituted for hierarchy; holding and observation conflated; no later-treatment check."

  - id: recent-amendment-transition
    prompt: "This statutory provision was amended recently. Research which version applies to conduct spanning the amendment date."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Compare point-in-time compilations, amendment and commencement provisions, application/savings/transitional rules, event dates and recent appellate treatment."
    required_output: "Separate pre-change and post-change rules, commencement and transition analysis, material recent development, affected facts, uncertainty and sources."
    prohibited_behaviours: "Apply the latest compilation to all conduct; equate assent with commencement; omit transitional provisions."
    pass_criteria: "The operative version for each period is established or the exact unresolved temporal issue is prioritised."
    likely_failure_modes: "Latest-text shortcut; amendment noticed but transition ignored; older case treated as definitive after statutory change."

  - id: multi-issue-completeness
    prompt: "A long-serving employee was dismissed after raising a safety concern during a restructure. Identify and research the material Australian employment issues."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Ask what legal issues reasonably arise; test system and instrument coverage, dismissal/redundancy, protections, safety connection, process, deadlines, remedies and interactions; exclude unsupported peripheral regimes."
    required_output: "Prioritised material issue map, reasons for inclusion, scoped analysis, critical facts and deadlines, and additional issues only if factually relevant."
    prohibited_behaviours: "Discuss every checklist item mechanically; add tax, privacy, licensing or payroll tax without factual relevance; omit a central dismissal, safety or protections issue."
    pass_criteria: "All reasonably arising material issues are identified and prioritised without irrelevant expansion."
    likely_failure_modes: "Single-issue redundancy answer; checklist dumping; no interaction or deadline analysis."

  - id: regulator-guidance-dependency
    prompt: "The only source currently cited for a proposed employer obligation is Fair Work Ombudsman guidance. Prepare a reliable answer."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Identify the guidance's legal status and any statutory footing; locate legislation, instruments and controlling decisions; document any source failure and dependency."
    required_output: "Guidance labelled as regulator interpretation or guidance, strongest-authority analysis, source-dependency statement, confidence and exact next verification step."
    prohibited_behaviours: "Present FWO guidance as binding law; discard it as irrelevant; claim multiple independent support from pages repeating the same rule."
    pass_criteria: "A legal obligation is stated only to the extent supported by binding or appropriately weighted authority, with residual dependency disclosed."
    likely_failure_modes: "Official publisher treated as legal force; no primary-source search; hidden single-source dependence."

  - id: critical-facts-uncertainty
    prompt: "Can this organisation dismiss the worker tomorrow? The employing entity, work location, employment status and governing instrument are unknown."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Create a structured uncertainty register, prioritise facts by potential effect on jurisdiction, coverage, process, deadline and remedy, and proceed only through labelled scenarios."
    required_output: "Issue, reason, legal impact, priority and information required for each material uncertainty; immediate factual enquiries, documents, critical timing and procedural risks."
    prohibited_behaviours: "Give an unconditional answer; list missing facts without priority or legal impact; mix assumptions into conclusions."
    pass_criteria: "The register identifies the employing entity and legal-system coverage among the highest-impact gaps and tells the solicitor what evidence to obtain next."
    likely_failure_modes: "Generic caveat; unprioritised question list; no practical next steps or deadline warning."

  - id: employee-contractor-case-research
    prompt: "A Queensland business calls a worker an independent contractor. The worker has an ABN, works fixed full-time hours, uses company equipment, reports to a manager, cannot subcontract, wears a uniform and has no other clients. Research whether the worker is an employee or contractor."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Map the applicable federal and Queensland framework and court hierarchy; search the leading High Court line, later application decisions, materially analogous cases and contrary or limiting authority; verify treatment, statutory change, judgment links and pinpoints; independently review proposition coverage."
    required_output: "Supported and conditional classification analysis; controlling and materially useful cases with direct judgment links, hierarchy, purpose and pinpoints; cited application of the legal principles to each material supplied fact; contrary indicators, uncertainty and research date."
    prohibited_behaviours: "Treat the contract label or ABN as decisive; rely only on Fair Work Ombudsman guidance; stop after one leading case; cite a case list without analytical functions; leave application statements uncited."
    pass_criteria: "The answer uses verified leading High Court authority, materially useful later and analogous authority, explains each case's function, and traces every material application and conclusion to authority without case dumping."
    likely_failure_modes: "Outdated multifactor test; guidance substituted for cases; lower authority overstated; missing links or pinpoints; paragraph-end citation masks several applications."

  - id: genuine-redundancy-case-research
    prompt: "An employee is dismissed for redundancy, but the same position is immediately advertised and filled. Research whether the dismissal is a genuine redundancy."
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Verify the current statutory test and applicable instrument; search relevant appellate authority, later application decisions, analogous advertising/refilling cases and material qualifications; verify judgment links, pinpoints, treatment and current statutory fit; independently review."
    required_output: "Cited statutory elements, controlling and useful application authorities with hierarchy and analytical purpose, supported application to the supplied facts, contrary or limiting authority, material missing facts and conditional conclusion."
    prohibited_behaviours: "Treat replacement advertising as automatically conclusive; conflate redundancy pay, consultation and s 389; stop at statutory guidance; include cumulative cases without purpose; give an uncited conclusion."
    pass_criteria: "The answer identifies the statutory test, materially relevant appellate and application authority, explains qualifications and traces every material application and conclusion to authority."
    likely_failure_modes: "Single-case answer; FWO-only analysis; unsupported inference from the advertisement; no instrument or redeployment analysis; non-judgment links."

  - id: insolvent-trading-directors-duties-citations
    prompt: "Review this statement: section 181 of the Corporations Act 2001 requires directors to prevent insolvent trading. Trace every correction to legislation or authority and distinguish the separate duties."
    expected_trigger: [australian-legal-reviewer]
    expected_not_trigger: [australian-legal-research-team, australian-legal-research]
    required_process: "Freeze the supplied statement; verify the current text and separate functions of ss 181 and 588G and any material qualifications; audit every correction and reviewer-introduced proposition for immediate authoritative support."
    required_output: "Severity and affected proposition; separately cited corrections for s 181 and the insolvent-trading framework; qualifications; direct primary-source links; reviewer-new-proposition ledger and self-audit."
    prohibited_behaviours: "Correct the section number under one paragraph-end citation; imply the two duties are interchangeable; introduce uncited statutory elements or case propositions; approve without proposition-level review."
    pass_criteria: "Each correction and distinction is immediately traceable to current legislation or verified authority, with no unsupported reviewer proposition."
    likely_failure_modes: "Right answer with wrong or remote citations; elements compressed; guidance used as law; reviewer introduces a different unsupported proposition."

  - id: citation-density-failure
    prompt: "Review the attached plausible legal answer. It contains several uncited application statements and places one citation only at the end of each long paragraph. Identify every citation-coverage defect."
    fixture_requirements: "Provide a frozen draft with at least three long paragraphs. Each paragraph must combine distinct legal rules, sourced observations, applications or conclusions, but contain only one end citation that supports no more than part of the paragraph. Mark the intentionally unsupported propositions in the evaluator-only answer key, not in the reviewer prompt."
    expected_trigger: [australian-legal-reviewer]
    expected_not_trigger: [australian-legal-research-team, australian-legal-research]
    required_process: "Build a sentence-and-clause proposition ledger; distinguish supplied facts, sourced observations and inferences; open each citation; test full and immediate support; classify defects and self-audit reviewer propositions."
    required_output: "Individual unsupported or partially supported propositions; remote-placement defects; required sentence splitting or clause citations; application-to-principle gaps; severity and exact correction."
    prohibited_behaviours: "Treat one paragraph-end citation as supporting every claim; report only a generic need for more citations; count citations instead of testing support; rewrite silently."
    pass_criteria: "Every material uncited, partially supported or remotely cited proposition is identified individually and the required point-of-support correction is stated."
    likely_failure_modes: "Paragraph-level rather than proposition-level audit; no distinction between supplied facts and inference; citation authenticity mistaken for support."

  - id: case-dumping-failure
    prompt: "Review the attached answer, which lists many loosely related Australian cases but does not explain why any of them matters. Determine whether the authorities are adequate."
    fixture_requirements: "Provide a frozen answer containing a verified controlling authority, materially useful later or contrary authority, and a substantially longer set of cumulative, weakly analogous or irrelevant cases. Use authentic citations and judgment links. Record each authority's intended keep/remove classification and reason in the evaluator-only answer key, not in the reviewer prompt."
    expected_trigger: [australian-legal-reviewer]
    expected_not_trigger: [australian-legal-research-team, australian-legal-research]
    required_process: "Verify the controlling hierarchy and discovery coverage; assign or test an analytical function for each materially relied-upon case; identify cumulative, irrelevant, lower-level or unsupported authorities; audit links and pinpoints."
    required_output: "Controlling authorities retained, necessary later/analogous/contrary authorities identified, cumulative or irrelevant cases rejected, analytical purpose required for each retained case, and severity-based revisions."
    prohibited_behaviours: "Treat citation volume as quality; preserve a long list without purpose; prefer recent lower authority over controlling precedent; demand a fixed numerical quota."
    pass_criteria: "The reviewer rejects cumulative and irrelevant authorities, preserves necessary hierarchy and coverage, and requires each included case to perform a clear analytical function."
    likely_failure_modes: "Case count used as metric; no hierarchy check; all cases accepted as topically relevant; useful contrary authority removed with the padding."

  - id: deterministic-focused-proposition
    prompt: "Research whether a narrow statutory employment obligation applies on the stated facts, including its controlling provision and material exception."
    fixture_requirements: "Supply one fixed Australian jurisdiction, employing-entity status, event date, complete facts needed for coverage, and one identified statutory obligation. Keep the fixture and research date identical across runs."
    repeat_runs: 3
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Freeze a focused research specification; verify governing legislation, controlling authority, material later authority, material contrary or limiting authority, currency and links; maintain one internal research record; stop when all six gates pass."
    required_output: "Concise short answer, governing law, principal authorities where material, application, qualifications and exceptions, cited conclusion, direct statute and case links, bounded completeness statement, research date and disclaimer."
    stability_dimensions: "Governing provisions, principal authorities, material propositions, exception, citations, preferred direct links and conclusion remain materially equivalent across all three fresh runs."
    prohibited_behaviours: "Escalate automatically to exhaustive case discovery; omit a material exception in one run; vary principal authority without a recorded source reason; expose the internal research record."
    pass_criteria: "All runs use focused research, pass every mandatory gate and differ only stylistically in their core legal content."
    likely_failure_modes: "One run stops at legislation while another finds controlling authority; variable citation density; different exception treatment; longer run adds only cumulative cases."

  - id: deterministic-comprehensive-memorandum
    prompt: "Prepare a current cited memorandum on the Australian legal issues arising from a fixed cross-border employment dispute involving possible Commonwealth and State regimes."
    fixture_requirements: "Supply the same complete employing-entity, work-location, contract, event-date, status, instrument and dispute facts for every run. Use a frozen evaluator issue map but do not expose it to the agent."
    repeat_runs: 3
    expected_trigger: [australian-legal-research-team]
    expected_not_trigger: []
    required_process: "Freeze a comprehensive specification; map regimes separately; execute the ordered source plan once; record legislation, databases, candidates, selection and rejection reasons; independently audit and use only targeted supplementary research for a named deficiency; certify all gates."
    required_output: "Stable short answer, governing law, principal-authority table with court/status/purpose/link/pinpoint, cited application, qualifications and exceptions, conclusion, research-completeness statement, date and disclaimer."
    stability_dimensions: "Material jurisdictions, provisions, principal authorities, propositions, qualifications, exceptions, citations, links and conclusions remain materially equivalent across all three fresh runs."
    prohibited_behaviours: "Concatenate specialist reports; let each role repeat discovery; silently change issue scope; deliver after a failed gate; treat extra execution time or case volume as quality."
    pass_criteria: "All runs cover the same material legal content and authority set subject only to recorded source availability, and each trace shows one shared research record rather than duplicated research."
    likely_failure_modes: "Different regimes or appellate authorities across runs; reviewer conducts a second full search; citation deserts; one run omits a material qualification; no stopping basis."

  - id: reviewer-targeted-research-only
    prompt: "Review the attached researched answer and internal research record. The record covers all planned categories except later treatment of one principal appellate case."
    fixture_requirements: "Provide a frozen draft and record with authentic sources, completed searches and one clearly bounded later-treatment gap."
    expected_trigger: [australian-legal-reviewer]
    expected_not_trigger: [australian-legal-research-team, australian-legal-research]
